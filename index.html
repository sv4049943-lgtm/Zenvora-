<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZENVORA | Smart Shopping</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">ZENVORA</div>
  <div class="tagline">Smart Shopping, Better Living</div>
  <input id="search" type="search" placeholder="Search products..." oninput="searchProducts()">
  <button onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <div>
    <p>🔥 TRENDING DEALS</p>
    <h1>Shop Smart.<br>Live Better.</h1>
    <p>Discover popular products at great prices.</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
      Shop Now →
    </button>
  </div>
</section>

<div class="categories">
  <button onclick="filterProducts('All')">All</button>
  <button onclick="filterProducts('Home')">Home</button>
  <button onclick="filterProducts('Kitchen')">Kitchen</button>
  <button onclick="filterProducts('Electronics')">Electronics</button>
  <button onclick="filterProducts('Beauty')">Beauty</button>
  <button onclick="filterProducts('Lifestyle')">Lifestyle</button>
</div>

<main id="products">
  <h2>🔥 Trending Products</h2>
  <div id="productGrid" class="grid"></div>
</main>

<div id="cartBox" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeCart()">×</button>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="cartTotal">0</span></h3>
    <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
  </div>
</div>

<button class="ai" onclick="aiHelp()">🤖 AI Help</button>

<footer>
  © 2026 ZENVORA — Smart Shopping, Better Living
</footer>

<script src="script.js"></script>
</body>
</html>
