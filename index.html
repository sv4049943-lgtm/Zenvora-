<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZENVORA | Smart Shopping</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">ZENVORA</div>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Search products...">
    <button onclick="searchProducts()">🔍</button>
  </div>

  <button class="cartBtn" onclick="openCart()">
    🛒 Cart <span id="cartCount">0</span>
  </button>
</header>

<nav>
  <button onclick="filterProducts('all')">All</button>
  <button onclick="filterProducts('tape')">Packing</button>
  <button onclick="filterProducts('home')">Home</button>
  <button onclick="filterProducts('electronics')">Electronics</button>
  <button onclick="filterProducts('fashion')">Fashion</button>
</nav>

<section class="hero">
  <h1>🔥 TRENDING DEALS</h1>
  <p>Smart Shopping. Better Living.</p>
  <button onclick="document.getElementById('products').scrollIntoView()">
    Shop Now →
  </button>
</section>

<h2 class="title">Popular Products</h2>

<section id="products" class="products"></section>

<div id="cartModal" class="modal">
  <div class="cartBox">
    <button class="close" onclick="closeCart()">✕</button>
    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <h3>Total: ₹<span id="cartTotal">0</span></h3>

    <button class="checkout" onclick="checkout()">
      Proceed to Checkout
    </button>
  </div>
</div>

<footer>
  <h3>ZENVORA</h3>
  <p>Smart Shopping. Better Living.</p>
  <p>© 2026 ZENVORA</p>
</footer>

<script src="script.js"></script>

</body>
</html>
